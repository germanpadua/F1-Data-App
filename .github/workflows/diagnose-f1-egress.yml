name: Diagnose the F1 data egress

# TEMPORARY diagnostic, delete once the cause is known.
#
# The daily export job can fetch the 2026 schedule from a GitHub-hosted runner
# ("latest completed round: 2026 round 15") but cannot load a single session
# stream: every F1 data channel fails in a few seconds and the export dies with
# fastf1.exceptions.DataNotLoadedError. This job prints the raw HTTP result so
# the cause is a measurement instead of a guess, and compares a 2026 session
# against a 2025 one to separate "the runner's egress" from "this session".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pipx install uv

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Probe the F1 static endpoints
        run: |
          .venv/bin/python - <<'PY'
          import urllib.error
          import urllib.request

          import fastf1

          HOST = "https://livetiming.formula1.com"

          def probe(label, url):
              print(f"-- {label}: {url}")
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = response.read()
                      print(
                          f"   status={response.status} bytes={len(body)} "
                          f"type={response.headers.get('content-type')} "
                          f"server={response.headers.get('server')}"
                      )
              except urllib.error.HTTPError as exc:
                  print(f"   HTTPError status={exc.code} reason={exc.reason}")
                  print(f"   server={exc.headers.get('server')} cf-ray={exc.headers.get('cf-ray')}")
              except Exception as exc:  # noqa: BLE001 - a diagnostic reports anything
                  print(f"   FAILED {type(exc).__name__}: {exc}")

          fastf1.Cache.enable_cache("cache")
          print("fastf1", fastf1.__version__)

          for year, round_number, label in ((2026, 15, "2026 r15"), (2025, 15, "2025 r15")):
              session = fastf1.get_session(year, round_number, "R")
              print(f"== {label}: {session.event['EventName']} api_path={session.api_path}")
              probe("SessionInfo", HOST + session.api_path + "SessionInfo.jsonStream")
              probe("TimingData", HOST + session.api_path + "TimingData.jsonStream")

          print("== fastf1 get_event_schedule(2026) ==")
          schedule = fastf1.get_event_schedule(2026, include_testing=False)
          print("rows:", len(schedule), "last:", schedule.iloc[-1]["EventName"])

          print("== fastf1 load(2026 r15) with DEBUG ==")
          fastf1.set_log_level("DEBUG")
          try:
              race = fastf1.get_session(2026, 15, "R")
              race.load(telemetry=False, weather=False, messages=False)
              print("LOAD OK:", race.session_info.get("EventName"))
          except Exception as exc:  # noqa: BLE001 - a diagnostic reports anything
              print(f"LOAD FAILED {type(exc).__name__}: {exc}")
          PY
