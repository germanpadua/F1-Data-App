# Phase 1 CI (P1.9): export the most recently completed round, run the
# self-check, upload the artifacts as a workflow artifact, and publish the
# published season (pipeline/scope.py) to Vercel Blob.
#
# ARTIFACTS ARE NEVER COMMITTED TO THE REPOSITORY. This workflow must not
# run `git add`, `git commit` or `git push`, ever: race data lives in
# data/export/ (gitignored) and is uploaded as a workflow artifact only.
# Public publishing goes to Vercel Blob via tools/blob-publish/publish.mjs;
# a missing BLOB_READ_WRITE_TOKEN secret makes the publisher SKIP with
# exit 0, so CI stays green for forks without the token.

name: Export latest round

on:
  schedule:
    # Daily, mid-morning UTC: covers races that finished the previous day.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SEASON: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pipx install uv

      - name: Resolve the season for the cache keys
        run: echo "SEASON=$(date -u +%Y)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      # The schedule fetch is light and deliberately runs BEFORE the cache
      # restore so both cache keys can include the discovered round.
      - name: Discover the most recently completed round
        id: discover
        run: |
          .venv/bin/python - <<'PY'
          import os
          from datetime import datetime, timezone

          import pandas as pd
          import fastf1

          today = pd.Timestamp(datetime.now(timezone.utc).date())
          year = today.year
          schedule = fastf1.get_event_schedule(year, include_testing=False)
          completed = schedule[schedule["EventDate"] < today]
          if completed.empty:
              # Early in a season: nothing has finished yet. This is a
              # clean no-op, not a failure.
              round_number = ""
              print(f"no completed round yet in the {year} season")
          else:
              event = completed.iloc[-1]
              round_number = int(event["RoundNumber"])
              print(
                  f"latest completed round: {year} round {round_number} "
                  f"({event['EventName']})"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"year={year}\nround={round_number}\n")
          PY

      # CACHE KEYING: actions/cache never re-saves on an exact key hit, so a
      # static per-season key would freeze the cache at the first run and the
      # job WOULD re-download every later session. The keys therefore roll
      # with the discovered round and are restored via the season prefix, so
      # each round's run saves a cumulative snapshot and no session is ever
      # re-downloaded within a season.
      - name: Cache the FastF1 cache
        if: steps.discover.outputs.round != ''
        uses: actions/cache@v4
        with:
          path: cache
          key: fastf1-cache-${{ env.SEASON }}-r${{ steps.discover.outputs.round }}
          restore-keys: |
            fastf1-cache-${{ env.SEASON }}-
            fastf1-cache-

      - name: Cache the exported artifacts
        # Restoring the previous data/export is what makes the
        # "nothing new to export" check below work on scheduled runs
        # (artifacts uploaded in step 12 are NOT restored into the checkout).
        if: steps.discover.outputs.round != ''
        uses: actions/cache@v4
        with:
          path: data/export
          key: f1-export-${{ env.SEASON }}-r${{ steps.discover.outputs.round }}
          restore-keys: |
            f1-export-${{ env.SEASON }}-

      - name: Skip when the round is already exported
        id: skip
        if: steps.discover.outputs.round != ''
        run: |
          SKIP=$(.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          year = int("${{ steps.discover.outputs.year }}")
          round_number = int("${{ steps.discover.outputs.round }}")
          index_path = Path("data/export/index.json")
          already = False
          if index_path.is_file():
              index = json.loads(index_path.read_text(encoding="utf-8"))
              already = any(
                  r.get("year") == year and r.get("round") == round_number
                  for r in index.get("races", [])
              )
          print("true" if already else "false")
          PY
          )
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "${{ steps.discover.outputs.year }} round ${{ steps.discover.outputs.round }} is already exported; nothing new to do"
          fi

      - name: Nothing new to export
        # No completed round yet, or the latest one is already exported:
        # both are clean no-ops, the job exits successfully.
        if: steps.discover.outputs.round == '' || steps.skip.outputs.skip == 'true'
        run: echo "nothing new to export; exiting successfully"

      - name: Create the FastF1 cache directory
        # actions/cache does NOT create its path on a miss, and cache/ is
        # gitignored (git cannot track an empty directory), so on a cold cache
        # fastf1.Cache.enable_cache raised NotADirectoryError and the export
        # never ran on a runner at all. Idempotent when the cache was restored.
        if: steps.discover.outputs.round != '' && steps.skip.outputs.skip != 'true'
        run: mkdir -p cache

      - name: Export the round
        if: steps.discover.outputs.round != '' && steps.skip.outputs.skip != 'true'
        run: |
          .venv/bin/python -m pipeline.export \
            --year "${{ steps.discover.outputs.year }}" \
            --round "${{ steps.discover.outputs.round }}" \
            --session R

      - name: Self-check the artifacts
        if: steps.discover.outputs.round != '' && steps.skip.outputs.skip != 'true'
        run: .venv/bin/python -m pipeline.check --root data/export

      - name: Upload artifacts
        # Uploaded as a workflow artifact ONLY — never committed (see the
        # comment at the top of this file).
        if: steps.discover.outputs.round != '' && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f1-export-${{ steps.discover.outputs.year }}-r${{ steps.discover.outputs.round }}
          path: data/export/

      # PUBLISHING: the publisher itself enforces the published-season scope
      # (pipeline/scope.py, mirrored in tools/blob-publish/publish.mjs), so
      # it can run on every discovered round — including the skip path,
      # where data/export comes from cache and the run would otherwise
      # never catch up after a past token-less run. It is idempotent: a
      # pathname already in Blob is overwritten. The Node dependency is
      # isolated under tools/blob-publish (NO root package.json: the future
      # frontend gets its own directory and Vercel project).
      - name: Install the Blob publisher dependency
        if: steps.discover.outputs.round != ''
        run: npm install --prefix tools/blob-publish

      - name: Test the Blob publisher
        # The index merge and the stale-read guard are pure logic with a
        # node --test suite; run it before anything touches the store.
        if: steps.discover.outputs.round != ''
        run: npm test --prefix tools/blob-publish

      - name: Publish to Vercel Blob
        # Without the secret this prints that publishing was skipped and
        # exits 0 — a missing optional credential is never a red build.
        if: steps.discover.outputs.round != ''
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node tools/blob-publish/publish.mjs
